name: Quality checks

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  reusable-quality:
    name: Reusable Node.js quality
    uses: AlexFrigenti/project-quality/.github/workflows/node-quality.yml@28f01d394b9b212a302a49d010cd5e928052e8e8
    with:
      node-version: "22.13.0"
      install-command: npm ci
      preflight-command: |
        node --check build.js
        node --check scripts/app.js
        node --check registro.js
        node --check sw.js
      build-command: npm run build
      test-command: npm test
      smoke-command: |
        test -f www/index.html
        test -f www/styles/app.css
        test -f www/scripts/app.js
        test -f www/manifest.webmanifest
        test -f www/icon-512.png
