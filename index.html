<title>Núcleo</title>

<style>
:root{
  --fondo:#0E1218;
  --capa:#161C25;
  --capa-alta:#1D2530;
  --linea:#26313F;
  --texto:#E6EDF5;
  --tenue:#7C8B9E;
  --frio:#4FC3D9;
  --calor:#F0A22E;
  --ardiendo:#FF5E3A;
  --tono:var(--frio);
  --pulso:3s;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--fondo);color:var(--texto);font-family:var(--sans);overscroll-behavior:none}
body{
  padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 28px);
  max-width:540px;margin:0 auto;
  -webkit-user-select:none;user-select:none;
}
.eyebrow{
  font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--tenue);font-weight:600;
}

/* --- aviso de progreso offline --- */
#offline{
  display:none;border:1px solid var(--linea);background:var(--capa);
  border-radius:12px;padding:11px 13px;margin-bottom:16px;
  font-size:13px;color:var(--tenue);line-height:1.45;
}
#offline b{color:var(--calor);font-family:var(--mono);font-weight:600}

/* --- aviso de nueva versión --- */
#actualiza{
  display:none;border:1px solid var(--frio);background:var(--capa);
  border-radius:12px;padding:12px 13px;margin-bottom:16px;cursor:pointer;
  font-size:13px;color:var(--frio);line-height:1.45;font-weight:600;text-align:center;
}
#actualiza:active{background:var(--capa-alta)}

/* --- el núcleo --- */
#nucleo{
  position:relative;display:flex;flex-direction:column;align-items:center;
  padding:6px 0 2px;cursor:pointer;
}
#anillo{width:200px;height:200px;display:block}
#anillo .pista{fill:none;stroke:var(--linea);stroke-width:3}
#anillo .carga{
  fill:none;stroke:var(--tono);stroke-width:3;stroke-linecap:round;
  transition:stroke-dashoffset .3s linear,stroke .8s linear;
}
#halo{
  position:absolute;top:16px;width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle,var(--tono) 0%,transparent 68%);
  opacity:.16;animation:latido var(--pulso) ease-in-out infinite;pointer-events:none;
}
@keyframes latido{0%,100%{transform:scale(.86);opacity:.10}50%{transform:scale(1.06);opacity:.26}}
#lectura{position:absolute;top:0;height:200px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;pointer-events:none}
#julios{font-family:var(--mono);font-size:34px;font-weight:600;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
#tasa{font-family:var(--mono);font-size:14px;color:var(--tono);
  font-variant-numeric:tabular-nums;transition:color .8s linear}
#restante{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--tenue);margin-top:2px}

/* --- gráfica --- */
#grafica{width:100%;height:44px;display:block;margin:12px 0 22px;overflow:visible}
#grafica path{fill:none;stroke:var(--tono);stroke-width:1.5;stroke-linejoin:round;
  transition:stroke .8s linear}
#grafica .base{stroke:var(--linea);stroke-width:1}

/* --- secciones --- */
h2{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--tenue);
  font-weight:600;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline}
h2 span{font-family:var(--mono);letter-spacing:0;text-transform:none;font-size:11px}
section{margin-bottom:26px}

/* --- fichas --- */
.ficha{
  width:100%;text-align:left;display:grid;
  grid-template-columns:1fr auto;gap:2px 10px;align-items:center;
  background:var(--capa);border:1px solid var(--linea);border-radius:12px;
  padding:12px 14px;margin-bottom:8px;color:var(--texto);
  font-family:var(--sans);transition:background .12s,border-color .12s,opacity .2s;
}
.ficha:active{background:var(--capa-alta)}
.ficha[disabled]{opacity:.4}
.ficha .nombre{font-size:15px;font-weight:600;letter-spacing:-.01em}
.ficha .detalle{grid-column:1;font-size:11px;color:var(--tenue);font-family:var(--mono);
  font-variant-numeric:tabular-nums}
.ficha .precio{grid-row:1/3;font-family:var(--mono);font-size:14px;font-weight:600;
  text-align:right;font-variant-numeric:tabular-nums}
.ficha .cant{grid-row:1/3;font-family:var(--mono);font-size:20px;font-weight:600;
  color:var(--tenue);min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
.asequible .precio{color:var(--calor)}
.ficha .precio{white-space:nowrap}
.ficha.mejora{border-style:dashed}

/* --- selector de cantidad de compra --- */
#selCompra{display:flex;gap:6px;margin-bottom:10px}
#selCompra .sel{
  flex:1;padding:8px 0;border-radius:9px;
  background:var(--capa);border:1px solid var(--linea);color:var(--tenue);
  font-family:var(--mono);font-size:12px;font-weight:600;
}
#selCompra .sel:active{background:var(--capa-alta)}
#selCompra .sel.activo{border-color:var(--frio);color:var(--frio);background:var(--capa-alta)}

/* --- glifo animado de cada módulo --- */
.ficha.modulo{grid-template-columns:28px 1fr auto auto;column-gap:12px}
.ficha.modulo .glifo{grid-column:1;grid-row:1/3;width:26px;height:26px;
  color:var(--tenue);display:flex;align-items:center;justify-content:center;
  transition:color .8s linear,opacity .3s}
.ficha.modulo .glifo svg{width:100%;height:100%;overflow:hidden}
.ficha.modulo .nombre{grid-column:2;grid-row:1}
.ficha.modulo .detalle{grid-column:2;grid-row:2}
.ficha.modulo .cant{grid-column:3;grid-row:1/3}
.ficha.modulo .precio{grid-column:4;grid-row:1/3}
.ficha.modulo.activo .glifo{color:var(--tono)}
.ficha.modulo:not(.activo) .glifo{opacity:.3}
.ficha.modulo:not(.activo) .glifo .anim,
.ficha.modulo:not(.activo) .glifo .anim2{animation-play-state:paused}

.glifo .anim,.glifo .anim2{transform-box:fill-box;transform-origin:center}
@keyframes girar{to{transform:rotate(360deg)}}
@keyframes latir{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(2px);opacity:1}}
@keyframes fluir{to{stroke-dashoffset:-8}}
@keyframes onda{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.55);opacity:0}}
@keyframes ondular{to{transform:translateX(-6px)}}
@keyframes nucleo{0%,100%{transform:scale(.8);opacity:.6}50%{transform:scale(1.1);opacity:1}}
@keyframes parpadeo{0%,100%{opacity:.55}50%{opacity:1}}
.g-sonda   .anim{transform-origin:center top;animation:latir 1.3s ease-in-out infinite}
.g-turbina .anim{animation:girar 2.2s linear infinite}
.g-inter   .anim{animation:fluir 1s linear infinite}
.g-inter   .anim2{animation:fluir 1s linear infinite reverse}
.g-bucle   .anim{animation:girar 3s linear infinite}
.g-pozo    .anim{animation:onda 2s ease-out infinite}
.g-pozo    .d2{animation-delay:1s}
.g-manto   .anim{animation:ondular 2.4s linear infinite}
.g-externo .anim{animation:girar 4s linear infinite}
.g-interno .anim{animation:nucleo 1.6s ease-in-out infinite}
.g-plasma  .anim{animation:girar 1.4s linear infinite,parpadeo .6s ease-in-out infinite}

/* --- recalibrar --- */
#recal{display:none;width:100%;padding:15px;border-radius:12px;
  background:transparent;border:1px solid var(--frio);color:var(--frio);
  font-family:var(--sans);font-size:14px;font-weight:600}
#recal:active{background:rgba(79,195,217,.1)}
#recal small{display:block;font-weight:400;font-size:11px;opacity:.75;margin-top:3px;
  font-family:var(--mono)}

/* --- sincronizar partida --- */
#secDatos .datos-btn{
  width:100%;padding:13px 14px;border-radius:12px;margin-bottom:8px;
  background:var(--capa);border:1px solid var(--linea);color:var(--texto);
  font-family:var(--sans);font-size:14px;font-weight:600;text-align:left;
}
#secDatos .datos-btn:active{background:var(--capa-alta)}
#secDatos #btnCargar{display:none;border-color:var(--frio);color:var(--frio)}
#secDatos #datosArea{
  display:none;width:100%;min-height:72px;margin-bottom:8px;padding:11px 13px;
  border-radius:12px;background:var(--capa);border:1px solid var(--linea);color:var(--texto);
  font-family:var(--mono);font-size:12px;line-height:1.4;resize:vertical;
  -webkit-user-select:text;user-select:text;
}
#secDatos #datosMsg{font-size:12px;color:var(--frio);margin-bottom:8px;
  min-height:1em;font-family:var(--mono);line-height:1.4}

/* --- pie --- */
footer{display:flex;justify-content:space-between;font-size:11px;color:var(--tenue);
  border-top:1px solid var(--linea);padding-top:12px;font-family:var(--mono)}
#borrar{background:none;border:none;color:var(--tenue);font-family:var(--mono);font-size:11px}

/* --- +N flotante --- */
.chispa{position:absolute;font-family:var(--mono);font-size:15px;font-weight:600;
  color:var(--tono);pointer-events:none;animation:subir .7s ease-out forwards}
@keyframes subir{to{transform:translateY(-46px);opacity:0}}

@media (prefers-reduced-motion:reduce){
  #halo{animation:none}.chispa{animation-duration:.01s}
  .glifo .anim,.glifo .anim2{animation:none}
}
</style>

<div id="actualiza"></div>
<div id="offline"></div>

<p class="eyebrow" style="text-align:center">Reactor geotérmico · sondeo profundo</p>

<div id="nucleo">
  <div id="halo"></div>
  <svg id="anillo" viewBox="0 0 200 200">
    <circle class="pista" cx="100" cy="100" r="88"/>
    <circle class="carga" cx="100" cy="100" r="88"
            transform="rotate(-90 100 100)" stroke-dasharray="553" stroke-dashoffset="553"/>
  </svg>
  <div id="lectura">
    <div id="julios">0</div>

</div>

</svg>

  <h2>Módulos <span id="totalMod"></span></h2>
  <div id="selCompra">
    <button class="sel activo" data-n="1">×1</button>

<script>
/* ============ ALMACENAMIENTO ============
   Funciona tanto dentro de Claude como en Safari en tu iPhone. */
const Guardado = {
  async leer(k){
    try{
      if(window.storage){const r = await window.storage.get(k); return r ? r.value : null;}
      return localStorage.getItem(k);
    }catch(e){ return null; }
  },
  async escribir(k,v){
    try{
      if(window.storage){ await window.storage.set(k,v); }
      else { localStorage.setItem(k,v); }
    }catch(e){ /* si falla, seguimos jugando */ }
  }
};
const CLAVE = 'nucleo_v1';

/* ============ CONTENIDO DEL JUEGO ============ */
const MODULOS = [
  {id:'sonda',  nombre:'Sonda térmica',  base:15,      prod:0.1},
  {id:'turbina',nombre:'Turbina',        base:120,     prod:1},
  {id:'inter',  nombre:'Intercambiador', base:1400,    prod:8},
  {id:'bucle',  nombre:'Bucle de vapor', base:20000,   prod:47},
  {id:'pozo',   nombre:'Pozo profundo',  base:330000,  prod:260},
  {id:'manto',  nombre:'Manto',          base:5100000, prod:1400},
  {id:'externo',nombre:'Núcleo externo', base:85000000,    prod:7800},
  {id:'interno',nombre:'Núcleo interno', base:1400000000,  prod:44000},
  {id:'plasma', nombre:'Forja de plasma',base:24000000000, prod:255000}
];
const CRECIMIENTO = 1.15;

const MEJORAS = [
  {id:'m1', nombre:'Aislante cerámico',    coste:500,      obj:'sonda',   mult:2,   req:s=>s.mod.sonda>=10,   nota:'Sondas x2'},
  {id:'m2', nombre:'Golpe firme',          coste:1200,     obj:'toque',   mult:5,   req:s=>s.toques>=25,      nota:'Extracción manual x5'},
  {id:'m3', nombre:'Rodamiento magnético', coste:6000,     obj:'turbina', mult:2,   req:s=>s.mod.turbina>=10, nota:'Turbinas x2'},
  {id:'m4', nombre:'Doble circuito',       coste:60000,    obj:'inter',   mult:2,   req:s=>s.mod.inter>=10,   nota:'Intercambiadores x2'},
  {id:'m5', nombre:'Blindaje de wolframio',coste:250000,   obj:'global',  mult:1.5, req:s=>s.mod.bucle>=5,    nota:'Producción total x1,5'},
  {id:'m6', nombre:'Presión crítica',      coste:900000,   obj:'bucle',   mult:2,   req:s=>s.mod.bucle>=10,   nota:'Bucles x2'},
  {id:'m7', nombre:'Perforación láser',    coste:8000000,  obj:'pozo',    mult:2,   req:s=>s.mod.pozo>=10,    nota:'Pozos x2'},
  {id:'m8', nombre:'Convección forzada',   coste:40000000,    obj:'manto',   mult:2,   req:s=>s.mod.manto>=10,   nota:'Mantos x2'},
  {id:'m9', nombre:'Resonancia sísmica',   coste:150000000,   obj:'global',  mult:1.5, req:s=>s.mod.externo>=5,  nota:'Producción total x1,5'},
  {id:'m10',nombre:'Contención toroidal',  coste:900000000,   obj:'externo', mult:2,   req:s=>s.mod.externo>=10, nota:'Núcleos externos x2'},
  {id:'m11',nombre:'Ignición por láser',   coste:12000000000, obj:'interno', mult:2,   req:s=>s.mod.interno>=10, nota:'Núcleos internos x2'},
  {id:'m12',nombre:'Campo de Higgs',       coste:100000000000,obj:'plasma',  mult:3,   req:s=>s.mod.plasma>=10,  nota:'Forjas de plasma x3'}
];

/* ---- niveles de mejora generados para cada módulo ----
   Cada módulo ya tiene su mejora "I" (arriba). Aquí añadimos II, III, IV y V,
   que se desbloquean al tener 25, 50, 100 y 200 de ese módulo. */
const TIERS_MOD = [
  {req:25,  etiqueta:'II',  mult:3, factor:5e3},
  {req:50,  etiqueta:'III', mult:3, factor:1.6e5},
  {req:100, etiqueta:'IV',  mult:4, factor:1.8e8},
  {req:200, etiqueta:'V',   mult:5, factor:2e14}
];
MODULOS.forEach(m=>{
  TIERS_MOD.forEach(t=>{
    MEJORAS.push({
      id: m.id + t.req,
      nombre: m.nombre + ' ' + t.etiqueta,
      coste: Math.round(m.base * t.factor),
      obj: m.id,
      mult: t.mult,
      req: ((id,req)=> st => st.mod[id] >= req)(m.id, t.req),
      nota: m.nombre + ' ×' + t.mult
    });
  });
});
// mejora global potente de remate
MEJORAS.push({
  id:'superc', nombre:'Superconductor', coste:5e11, obj:'global', mult:2,
  req:s=>s.mod.interno>=15, nota:'Producción total ×2'
});

/* ---- mejoras especiales: mecánicas distintas, no solo ×N de un módulo ----
   Las de obj:'especial' no multiplican nada por sí solas; su efecto está
   enganchado a mano en el código (busca tieneMejora('id')). */
MEJORAS.push(
  {id:'percutor',  nombre:'Percutor hidráulico', coste:2e6,  obj:'toque',    mult:10, req:s=>s.toques>=200, nota:'Extracción manual ×10'},
  {id:'sismografo',nombre:'Sismógrafo',          coste:5e7,  obj:'especial', mult:1,  req:s=>s.toques>=100, nota:'Cada toque suma +5% de tu producción/s'},
  {id:'bateria',   nombre:'Batería geotérmica',  coste:1e7,  obj:'especial', mult:1,  req:s=>s.isotopos>=1, nota:'Progreso sin conexión: 8 h → 24 h'},
  {id:'enriq',     nombre:'Enriquecimiento',     coste:5e9,  obj:'especial', mult:1,  req:s=>s.isotopos>=5, nota:'Cada isótopo da +8% (antes +5%)'},
  {id:'simbiosis', nombre:'Simbiosis de red',    coste:5e10, obj:'global',   mult:2,  req:s=>MODULOS.every(m=>s.mod[m.id]>=25), nota:'Producción total ×2 · con 25 de cada módulo'}
);

const UMBRAL = 1e6;                    // julios por el primer isótopo
const TOPE_AUSENTE = 8*3600;           // máximo 8 h de progreso sin abrir

/* ============ ESTADO ============ */
let s = nuevaPartida();
function nuevaPartida(){
  const mod = {}; MODULOS.forEach(m=>mod[m.id]=0);
  return { j:0, totalCiclo:0, mod, mejoras:[], isotopos:0, toques:0, t:Date.now() };
}

/* ============ CÁLCULOS ============ */
const tieneMejora = id => s.mejoras.includes(id);
// mejoras que puedes ver ahora (no compradas y con su requisito cumplido), baratas primero
function mejorasVisibles(){
  return MEJORAS.filter(u=>!tieneMejora(u.id) && u.req(s)).sort((a,b)=>a.coste-b.coste);
}
function multiplicadorDe(objetivo){
  let m = 1;
  MEJORAS.forEach(u=>{ if(u.obj===objetivo && tieneMejora(u.id)) m *= u.mult; });
  return m;
}
function bonusGlobal(){
  const porIso = tieneMejora('enriq') ? 0.08 : 0.05;
  return multiplicadorDe('global') * (1 + porIso * s.isotopos);
}
function produccionDe(m){
  return s.mod[m.id] * m.prod * multiplicadorDe(m.id) * bonusGlobal();
}
function porSegundo(){
  return MODULOS.reduce((t,m)=>t+produccionDe(m), 0);
}
function porToque(){
  return 1 * multiplicadorDe('toque') * bonusGlobal();
}
function costeDe(m){
  return m.base * Math.pow(CRECIMIENTO, s.mod[m.id]);
}
// coste total de comprar k unidades seguidas (suma geométrica)
function costeVarios(m,k){
  return costeDe(m) * (Math.pow(CRECIMIENTO,k) - 1) / (CRECIMIENTO - 1);
}
// cuántas unidades puedes permitirte ahora mismo
function maxAsequible(m){
  const cd = costeDe(m);
  const ratio = 1 + s.j*(CRECIMIENTO-1)/cd;
  let k = ratio > 1 ? Math.floor(Math.log(ratio)/Math.log(CRECIMIENTO)) : 0;
  if(k < 0) k = 0;
  while(k > 0 && costeVarios(m,k) > s.j) k--; // margen por redondeo
  return k;
}
function isotoposAlRecalibrar(){
  return Math.floor(Math.sqrt(s.totalCiclo / UMBRAL));
}

/* ============ FORMATO DE NÚMEROS ============ */
const SUF = ['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];
function fmt(n){
  if(!isFinite(n)) return '∞';
  if(n < 0) return '0';
  if(n < 1000) return n < 10 ? (Math.round(n*10)/10).toString() : Math.floor(n).toString();
  let i = Math.min(Math.floor(Math.log10(n)/3), SUF.length-1);
  const v = n / Math.pow(1000,i);
  const txt = v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : Math.floor(v).toString();
  return txt.replace('.',',') + ' ' + SUF[i];
}
function fmtTiempo(seg){
  const h = Math.floor(seg/3600), m = Math.floor(seg%3600/60);
  if(h) return h+' h '+m+' min';
  if(m) return m+' min';
  return Math.floor(seg)+' s';
}

/* ============ CONSTRUCCIÓN DE LA INTERFAZ ============ */
const $ = id => document.getElementById(id);
const ref = {};

/* dibujos animados de cada módulo (SVG) */
const GLIFOS = {
  sonda:'<svg class="g-sonda" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 4v9"/><path class="anim" d="M9 13h6l-3 5z" fill="currentColor" stroke="none"/></svg>',
  turbina:'<svg class="g-turbina" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><g class="anim"><rect width="24" height="24" fill="none"/><path d="M12 12V3"/><path d="M12 12l7.8 4.5"/><path d="M12 12L4.2 16.5"/></g><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg>',

function crearFichas(){
  const cm = $('modulos'); cm.innerHTML='';
  MODULOS.forEach(m=>{
    const b = document.createElement('button');
    b.className='ficha modulo';
    b.innerHTML = `<div class="glifo">${GLIFOS[m.id]||''}</div>
      <div class="nombre">${m.nombre}</div>
      <div class="detalle"></div>
      <div class="cant"></div>
      <div class="precio"></div>`;
    b.onclick = ()=>comprarModulo(m);
    cm.appendChild(b);
    ref[m.id] = {caja:b, glifo:b.querySelector('.glifo'), det:b.querySelector('.detalle'),
                 cant:b.querySelector('.cant'), pre:b.querySelector('.precio')};
  });
}

function pintarMejoras(){
  const cu = $('mejoras'); cu.innerHTML='';
  const visibles = mejorasVisibles();
  $('secMejoras').style.display = visibles.length ? 'block' : 'none';
  visibles.forEach(u=>{
    const b = document.createElement('button');
    b.className='ficha mejora';
    b.innerHTML = `<div class="nombre">${u.nombre}</div>
      <div class="detalle">${u.nota}</div>
      <div class="precio">${fmt(u.coste)}</div>`;
    b.disabled = s.j < u.coste;
    if(s.j >= u.coste) b.classList.add('asequible');
    b.onclick = ()=>{
      if(s.j < u.coste) return;
      s.j -= u.coste; s.mejoras.push(u.id);
      pintarMejoras(); guardar();
    };
    cu.appendChild(b);
  });
}

let modoCompra = 1; // 1, 10, 100 o 'max'
document.querySelectorAll('#selCompra .sel').forEach(btn=>{
  btn.onclick = ()=>{
    const v = btn.dataset.n;
    modoCompra = (v === 'max') ? 'max' : parseInt(v,10);
    document.querySelectorAll('#selCompra .sel').forEach(b=>b.classList.toggle('activo', b===btn));
  };
});

function comprarModulo(m){
  const k = (modoCompra === 'max') ? maxAsequible(m) : modoCompra;
  if(k < 1) return;
  const total = costeVarios(m, k);
  if(s.j < total) return;           // en modos fijos, exige poder pagar todo el lote
  s.j -= total; s.mod[m.id] += k;
  pintarMejoras(); guardar();
}

/* color del glifo según cuántas unidades de ESE módulo tengas */
const NIVELES = [
  {min:200, col:'#FF5E3A'},  // ardiendo
  {min:100, col:'#FF7A34'},  // naranja intenso
  {min:50,  col:'#F0A22E'},  // naranja
  {min:25,  col:'#B9D14A'},  // lima
  {min:10,  col:'#4FD0A6'},  // turquesa
  {min:0,   col:'#4FC3D9'}   // frío
];
function colorNivel(n){
  for(const nv of NIVELES){ if(n >= nv.min) return nv.col; }
  return '#4FC3D9';
}

/* ============ TOQUE EN EL NÚCLEO ============ */
$('nucleo').addEventListener('pointerdown', e=>{
  const g = porToque() + (tieneMejora('sismografo') ? 0.05 * porSegundo() : 0);
  s.j += g; s.totalCiclo += g; s.toques++;
  const chispa = document.createElement('div');
  chispa.className='chispa'; chispa.textContent='+'+fmt(g);
  const caja = $('nucleo').getBoundingClientRect();
  chispa.style.left = (e.clientX - caja.left - 12)+'px';
  chispa.style.top  = (e.clientY - caja.top  - 14)+'px';
  $('nucleo').appendChild(chispa);
  setTimeout(()=>chispa.remove(), 700);
  pintarMejoras();
});

/* ============ RECALIBRAR (prestigio) ============ */
$('recal').onclick = ()=>{
  const gana = isotoposAlRecalibrar();
  if(gana < 1) return;
  if(!confirm(`Recalibrar reinicia julios, módulos y mejoras.\n\nGanas ${gana} isótopo${gana>1?'s':''} (+${gana*5}% de producción para siempre).\n\n¿Seguimos?`)) return;
  const iso = s.isotopos + gana;
  s = nuevaPartida(); s.isotopos = iso;
  pintarMejoras(); guardar();
};

$('borrar').onclick = ()=>{
  if(!confirm('Se borra todo, incluidos los isótopos. ¿Seguro?')) return;
  s = nuevaPartida(); pintarMejoras(); guardar();
};

/* ============ EXPORTAR / IMPORTAR PARTIDA ============
   Sincronización manual entre dispositivos mediante un código de texto.
   No sale nada a ningún servidor: el código lo mueves tú (copiar/pegar). */
function codificar(str){ return btoa(unescape(encodeURIComponent(str))); }
function decodificar(code){ return decodeURIComponent(escape(atob(code))); }

$('btnExportar').onclick = ()=>{
  guardar();
  const code = 'NUCLEO:' + codificar(JSON.stringify(s));
  const area = $('datosArea');
  area.style.display = 'block';
  area.value = code;
  $('btnCargar').style.display = 'none';
  area.focus(); area.select();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(code)
      .then(()=> $('datosMsg').textContent = '✓ Código copiado. Ábrelo en el otro dispositivo, pulsa "Importar" y pégalo.')
      .catch(()=> $('datosMsg').textContent = 'Copia a mano el código de arriba y pégalo en el otro dispositivo.');
  } else {
    $('datosMsg').textContent = 'Copia a mano el código de arriba y pégalo en el otro dispositivo.';
  }
};

$('btnImportar').onclick = ()=>{
  const area = $('datosArea');
  area.style.display = 'block';
  area.value = '';
  $('btnCargar').style.display = 'block';
  area.focus();
  $('datosMsg').textContent = 'Pega aquí el código del otro dispositivo y pulsa "Cargar".';
};

$('btnCargar').onclick = ()=>{
  let code = $('datosArea').value.trim();
  if(!code){ $('datosMsg').textContent = 'No hay ningún código pegado.'; return; }
  if(code.startsWith('NUCLEO:')) code = code.slice(7);
  let datos;
  try{ datos = JSON.parse(decodificar(code)); }
  catch(e){ $('datosMsg').textContent = '✗ El código no es válido.'; return; }
  if(!datos || typeof datos.j !== 'number' || typeof datos.mod !== 'object'){
    $('datosMsg').textContent = '✗ Ese código no parece una partida de Núcleo.'; return;
  }
  if(!confirm('Esto reemplazará la partida de ESTE dispositivo por la del código. ¿Seguro?')) return;
  s = Object.assign(nuevaPartida(), datos);
  MODULOS.forEach(m=>{ if(typeof s.mod[m.id] !== 'number') s.mod[m.id]=0; });
  guardar();
  crearFichas(); pintarMejoras();
  $('datosArea').style.display = 'none';
  $('btnCargar').style.display = 'none';
  $('datosMsg').textContent = '✓ Partida importada correctamente.';
};

/* ============ COLOR SEGÚN CALOR ============ */
function mezclar(a,b,t){
  const h = x=>[1,3,5].map(i=>parseInt(x.substr(i,2),16));
  const [r1,g1,b1]=h(a), [r2,g2,b2]=h(b);
  const c = (u,v)=>Math.round(u+(v-u)*t).toString(16).padStart(2,'0');
  return '#'+c(r1,r2)+c(g1,g2)+c(b1,b2);
}
function tonoActual(jps){
  const t = Math.max(0, Math.min(1, Math.log10(jps+1)/6));
  const col = t < .5 ? mezclar('#4FC3D9','#F0A22E', t*2)
                     : mezclar('#F0A22E','#FF5E3A',(t-.5)*2);
  document.documentElement.style.setProperty('--tono', col);
  document.documentElement.style.setProperty('--pulso', (3.2 - t*2.2).toFixed(2)+'s');
}

/* ============ GRÁFICA DE LOS ÚLTIMOS 60 s ============ */
const historial = new Array(60).fill(0);
function pintarGrafica(){
  const max = Math.max(...historial, 1);
  const pts = historial.map((v,i)=>{
    const x = i/59*300;
    const y = 43 - (v/max)*40;
    return (i?'L':'M') + x.toFixed(1) + ' ' + y.toFixed(1);
  });
  $('linea').setAttribute('d', pts.join(' '));
}

/* ============ BUCLE PRINCIPAL ============ */
let ultimo = performance.now(), acumTic = 0, acumGuardado = 0;

function bucle(ahora){
  const dt = Math.min((ahora - ultimo)/1000, 1);
  ultimo = ahora;

  const jps = porSegundo();
  const ganado = jps * dt;
  s.j += ganado; s.totalCiclo += ganado;

  acumTic += dt;
  if(acumTic >= 1){ acumTic = 0; historial.push(jps); historial.shift(); pintarGrafica(); }

  acumGuardado += dt;
  if(acumGuardado >= 5){ acumGuardado = 0; guardar(); }

  dibujar(jps);
  requestAnimationFrame(bucle);
}

function dibujar(jps){
  $('julios').textContent = fmt(s.j);
  $('tasa').textContent = fmt(jps)+' J/s';
  tonoActual(jps);

  // anillo: avance hacia el siguiente isótopo
  const actual = isotoposAlRecalibrar();
  const desde = Math.pow(actual,2)*UMBRAL;
  const hasta = Math.pow(actual+1,2)*UMBRAL;
  const p = Math.max(0, Math.min(1, (s.totalCiclo - desde)/(hasta - desde)));
  document.querySelector('#anillo .carga').setAttribute('stroke-dashoffset', 553*(1-p));

  const falta = (hasta - s.totalCiclo)/Math.max(jps, 0.0001);
  $('restante').textContent = actual >= 1
      ? 'siguiente isótopo en ' + (jps>0 ? fmtTiempo(falta) : '—')
      : 'primer isótopo al ' + Math.floor(p*100) + '%';

  let totalMod = 0;
  MODULOS.forEach(m=>{
    const r = ref[m.id], n = s.mod[m.id];
    totalMod += n;
    let k, coste, puedo;
    if(modoCompra === 'max'){
      k = maxAsequible(m);
      coste = costeVarios(m, Math.max(k,1));
      puedo = k >= 1;
    }else{
      k = modoCompra;
      coste = costeVarios(m, k);
      puedo = s.j >= coste;
    }
    r.cant.textContent = n || '';
    r.pre.textContent  = (modoCompra === 'max' && k >= 1) ? (k + '× ' + fmt(coste)) : fmt(coste);
    r.det.textContent  = n ? fmt(produccionDe(m))+' J/s' : '+'+fmt(m.prod*multiplicadorDe(m.id)*bonusGlobal())+' J/s';
    r.caja.classList.toggle('asequible', puedo);
    r.caja.classList.toggle('activo', n>0);
    r.glifo.style.color = n>0 ? colorNivel(n) : '';
    r.caja.disabled = !puedo;
  });
  $('totalMod').textContent = totalMod ? totalMod+' instalados' : '';

  const gana = isotoposAlRecalibrar();
  const boton = $('recal');
  boton.style.display = (gana >= 1) ? 'block' : 'none';
  if(gana >= 1) boton.innerHTML =
    `Recalibrar por ${gana} isótopo${gana>1?'s':''}<small>reinicia el ciclo · +${gana*5}% permanente</small>`;

  $('isotopos').textContent = s.isotopos
    ? s.isotopos+' isótopos · +'+(s.isotopos*5)+'%' : 'sin isótopos';

  // las mejoras solo cambian de estado, no hace falta repintarlas cada fotograma
  const vis = mejorasVisibles();
  document.querySelectorAll('#mejoras .ficha').forEach((b,i)=>{
    const u = vis[i];
    if(!u) return;
    const puedo = s.j >= u.coste;
    b.disabled = !puedo; b.classList.toggle('asequible', puedo);
  });
}

/* ============ GUARDAR Y CARGAR ============ */
function guardar(){
  s.t = Date.now();
  Guardado.escribir(CLAVE, JSON.stringify(s));
}
async function cargar(){
  const bruto = await Guardado.leer(CLAVE);
  if(bruto){
    try{
      const d = JSON.parse(bruto);
      s = Object.assign(nuevaPartida(), d);
      MODULOS.forEach(m=>{ if(typeof s.mod[m.id] !== 'number') s.mod[m.id]=0; });

      const tope = tieneMejora('bateria') ? 24*3600 : TOPE_AUSENTE;
      const fuera = Math.min((Date.now() - (d.t||Date.now()))/1000, tope);
      if(fuera > 60){
        const extra = porSegundo() * fuera;
        if(extra > 0){
          s.j += extra; s.totalCiclo += extra;
          const aviso = $('offline');
          aviso.innerHTML = `Mientras no estabas (${fmtTiempo(fuera)}) el reactor siguió trabajando: <b>+${fmt(extra)} J</b>`;
          aviso.style.display = 'block';
          aviso.onclick = ()=>aviso.style.display='none';
        }
      }
    }catch(e){ /* partida corrupta: empezamos de cero */ }
  }
  crearFichas(); pintarMejoras();
  requestAnimationFrame(t=>{ ultimo = t; bucle(t); });
}

// iOS congela la pestaña sin avisar: guardamos al salir de la app
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) guardar(); });
window.addEventListener('pagehide', guardar);

cargar();

/* ============ SISTEMA DE ACTUALIZACIÓN ============
   VERSION: súbela en 1 cada vez que publiques cambios,
   y pon el mismo número en el archivo version.json.
   Así la app sabe cuándo hay algo nuevo publicado. */
const VERSION = 11;
$('version').textContent = 'v' + VERSION;

// Registra el service worker (copia offline). Cuando confirme que
// ha refrescado la copia, recargamos para mostrar lo nuevo.
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
  navigator.serviceWorker.addEventListener('message', e=>{
    if(e.data === 'actualizado') location.reload();
  });
}

// Comprueba en silencio si hay una versión más nueva publicada.
function comprobarActualizacion(){
  fetch('./version.json', {cache:'no-store'})
    .then(r=>r.json())
    .then(d=>{
      if(d && d.v > VERSION){
        const b = $('actualiza');
        b.textContent = '✨ Nueva versión disponible · toca para actualizar';
        b.style.display = 'block';
        b.onclick = ()=>{
          b.textContent = 'Actualizando…';
          const sw = navigator.serviceWorker && navigator.serviceWorker.controller;
          if(sw){
            sw.postMessage('actualizar');
            setTimeout(()=>location.reload(), 2000); // red de seguridad
          }else{
            location.reload();
          }
        };
      }
    })
    .catch(()=>{ /* sin conexión: no pasa nada */ });
}
comprobarActualizacion();
// Vuelve a comprobar cada vez que regresas a la app.
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) comprobarActualizacion(); });
</script>
