<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Núcleo">
<meta name="theme-color" content="#0E1218">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" href="./icon-192.png">
<title>Núcleo</title>

<link rel="stylesheet" href="./styles/app.css">

<div id="actualiza"></div>
<div id="offline"></div>

<!-- ===== PÁGINAS: solo una visible a la vez ===== -->
<main id="paginas">

  <section class="pagina pagina-sondeo" data-pag="sondeo">
    <header id="cabecera">
  <p class="eyebrow" id="cabPozo" style="text-align:center">POZO 01 · SONDEO PROFUNDO</p>

  <div id="senal"><span class="senal-lbl">SEÑAL DE FONDO</span></div>

  <div id="nucleo">
    <div id="halo"></div>
    <svg id="anillo" viewBox="0 0 200 200">
      <circle class="pista" cx="100" cy="100" r="88"/>
      <circle class="carga" cx="100" cy="100" r="88"
              transform="rotate(-90 100 100)" stroke-dasharray="553" stroke-dashoffset="553"/>
    </svg>
    <div id="lectura">
      <div id="julios">0</div>
      <div id="prof">0 m</div>
      <div id="tasa">0 J/s</div>
      <div id="restante">toca para extraer</div>
    </div>
  </div>

  <div id="estrato"></div>

  <div id="telemetria">
    <div class="tel-cab"><span>PRODUCCIÓN</span><span>ÚLTIMOS 60 s</span></div>
    <svg id="grafica" viewBox="0 0 300 44" preserveAspectRatio="none">
      <g class="rejilla">
        <line x1="0" y1="11" x2="300" y2="11"/>
        <line x1="0" y1="22" x2="300" y2="22"/>
        <line x1="0" y1="33" x2="300" y2="33"/>
        <line x1="75" y1="0" x2="75" y2="44"/>
        <line x1="150" y1="0" x2="150" y2="44"/>
        <line x1="225" y1="0" x2="225" y2="44"/>
      </g>
      <path class="base" d="M0 43 H300"/>
      <path id="linea"/>
    </svg>
  </div>

  <button id="recal"></button>
  <div id="isotopos"></div>
    </header>
  </section>

  <section class="pagina oculta pagina-equipo" data-pag="equipo">
    <div class="subseccion">
      <h2>Módulos <span id="totalMod"></span></h2>
      <div id="selCompra">
      <button class="sel activo" data-n="1">×1</button>
      <button class="sel" data-n="10">×10</button>
      <button class="sel" data-n="100">×100</button>
      <button class="sel" data-n="max">Máx</button>
    </div>
      <div id="modulos"></div>
    </div>
    <div class="subseccion">
      <h2>Mejoras</h2>
      <div id="mejoras"></div>
    </div>
  </section>

  <section class="pagina oculta" data-pag="registro">
    <h2>Registro de perforación</h2>
    <div id="registroLista"></div>
  </section>

  <section class="pagina oculta" data-pag="sistema">
    <h2>Estadísticas</h2>
    <div id="statsPanel"></div>
    <h2 style="margin-top:24px">Hitos <span id="hitosResumen"></span></h2>
    <div id="hitosLista"></div>
  </section>

  <section class="pagina oculta" data-pag="ajustes" id="secDatos">
    <h2>Sincronizar partida</h2>
    <div id="datosMsg"></div>
    <button class="datos-btn" id="btnExportar">Exportar partida · copiar código</button>
    <button class="datos-btn" id="btnImportar">Importar partida · pegar código</button>
    <textarea id="datosArea" placeholder="Aquí aparecerá tu código, o pega uno para importar…"></textarea>
    <button class="datos-btn" id="btnCargar">Cargar el código pegado</button>

    <h2 style="margin-top:24px">Otros</h2>
    <button class="datos-btn" id="borrar">Borrar partida</button>
    <div id="version"></div>
  </section>

</main>

<!-- ===== NAVEGACIÓN INFERIOR FIJA ===== -->
<nav id="navbar" aria-label="Navegación principal">
  <button class="nav-tab activo" data-pag="sondeo" aria-label="Sondeo">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
    <span>Sondeo</span>
  </button>
  <button class="nav-tab" data-pag="equipo" aria-label="Equipo">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>
    <span>Equipo</span>
  </button>
  <button class="nav-tab" data-pag="registro" aria-label="Registro">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
    <span class="badge" id="regBadge"></span><span>Registro</span>
  </button>
  <button class="nav-tab" data-pag="sistema" aria-label="Sistema">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>
    <span>Sistema</span>
  </button>
  <button class="nav-tab" data-pag="ajustes" aria-label="Ajustes">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h9M18 8h2M4 16h4M13 16h7"/><circle cx="15.5" cy="8" r="2.3"/><circle cx="9.5" cy="16" r="2.3"/></svg>
    <span>Ajustes</span>
  </button>
</nav>

<div id="cierre">
  <div class="caja">
    <div class="cierre-cab" id="cierreCab">CIERRE DE POZO</div>
    <div class="cierre-txt" id="cierreTxt"></div>
    <button id="cierreOk">Emplazar nuevo pozo</button>
  </div>
</div>

<div id="hitoToast"></div>

<script src="./registro.js"></script>
<script src="./scripts/app.js"></script>
